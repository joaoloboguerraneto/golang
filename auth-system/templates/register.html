<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - AuthSystem</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>Criar Conta</h1>
                <p class="subtitle">Preencha os dados abaixo</p>
            </div>

            {{if .Error}}
            <div class="alert alert-error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{.Error}}
            </div>
            {{end}}

            <form method="POST" action="/register" id="registerForm">
                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="name" name="name" value="{{.Name}}" required placeholder="Seu nome">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="email" name="email" value="{{.Email}}" required placeholder="seu@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="birth_date">Data de nascimento</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <input type="date" id="birth_date" name="birth_date" required>
                    </div>
                    <span class="hint">Usada para recuperar a senha</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="password" name="password" required minlength="6" placeholder="Min. 6 caracteres">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirmar</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repita a senha">
                        </div>
                    </div>
                </div>

                <div class="captcha-section">
                    <div class="captcha-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>Verificacao de seguranca</span>
                    </div>
                    <div class="captcha-box">
                        <p class="captcha-question" id="captchaQuestion">{{.CaptchaQuestion}}</p>
                        <input type="hidden" name="captcha_token" id="captchaToken" value="{{.CaptchaToken}}">
                        <div class="captcha-input-row">
                            <input type="text" name="captcha_answer" id="captchaAnswer" required placeholder="Sua resposta" autocomplete="off">
                            <button type="button" class="btn-refresh" onclick="refreshCaptcha()" title="Novo desafio">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="23 4 23 10 17 10"/>
                                    <polyline points="1 20 1 14 7 14"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Criar conta
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                </button>
            </form>

            <div class="card-footer">
                <p>Ja tem uma conta? <a href="/login">Entrar</a></p>
            </div>
        </div>
    </div>

    <script>
        async function refreshCaptcha() {
            try {
                const response = await fetch('/captcha');
                const data = await response.json();
                document.getElementById('captchaToken').value = data.token;
                document.getElementById('captchaQuestion').textContent = data.question;
                document.getElementById('captchaAnswer').value = '';
                document.getElementById('captchaAnswer').focus();
            } catch (error) {
                console.error('Erro ao atualizar captcha:', error);
            }
        }

        // Validacao de senha em tempo real
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        confirmPassword.addEventListener('input', function() {
            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('As senhas nao coincidem');
            } else {
                confirmPassword.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
