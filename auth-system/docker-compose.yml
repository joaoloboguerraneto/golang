version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicacao Go
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authdb
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped

# Rede para comunicacao entre containers
networks:
  auth-network:
    driver: bridge

# Volume para persistir dados do PostgreSQL
volumes:
  postgres_data:
