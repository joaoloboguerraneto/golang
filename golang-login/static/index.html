<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Golang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        .form { display: none; }
        .form.active { display: block; }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            display: block;
        }
        .message.success {
            background: #efe;
            color: #080;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Workshop Go</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Entrar</div>
            <div class="tab" onclick="showTab('register')">Cadastrar</div>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm" class="form active" onsubmit="login(event)">
            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="seu@email.com">
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="loginPassword" required placeholder="Sua senha">
            </div>
            <button type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="form" onsubmit="register(event)">
            <div class="field">
                <label>Nome</label>
                <input type="text" id="regName" required placeholder="Seu nome">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="seu@email.com">
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="regPassword" required placeholder="Crie uma senha">
            </div>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'login' ? 1 : 2})`).classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            hideMessage();
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }

        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.data));
                    window.location.href = '/dashboard.html';
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (err) {
                showMessage('Erro de conexao', 'error');
            }
        }

        async function register(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('Cadastrado! Faca login.', 'success');
                    setTimeout(() => showTab('login'), 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (err) {
                showMessage('Erro de conexao', 'error');
            }
        }
    </script>
</body>
</html>
